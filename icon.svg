<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1838" />
      <stop offset="70%" stop-color="#07080c" />
      <stop offset="100%" stop-color="#030407" />
    </radialGradient>
    
    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Base (Maskable Safe Area) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />

  <!-- Outer Faint Track Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="18" />

  <!-- Luminous Glowing Progress Arc -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="1105" stroke-dashoffset="310"
          transform="rotate(-90 256 256)" filter="url(#glow)" />

  <!-- Leading Pulse Head -->
  <circle cx="380" cy="132" r="14" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="380" cy="132" r="7" fill="#ffffff" />

  <!-- Modern Geometric 'D' / Zero Monogram Center -->
  <g transform="translate(196, 176)">
    <!-- Sleek D Stem & Arc -->
    <path d="M 0,0 L 48,0 C 96,0 128,32 128,80 C 128,128 96,160 48,160 L 0,160 Z"
          fill="none" stroke="url(#glyphGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Core Telemetry Pulse Center -->
    <circle cx="48" cy="80" r="16" fill="url(#ringGrad)" />
  </g>
</svg>
